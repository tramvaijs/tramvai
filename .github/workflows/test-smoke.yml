name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      os:
        description: 'OS to run the smoke test on'
        type: choice
        required: false
        default: all
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest

env:
  CI: true

jobs:
  bootstrap:
    # on pull requests the smoke test is opt-in via the "smoke" label,
    # the full matrix is too heavy to run on every PR
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'smoke')

    strategy:
      # every OS should be checked even if another one has already failed
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup Git
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Setup tramvai
        run: npm i -g @tramvai/cli@prerelease

      - name: Setup tramvai debug
        run: tramvai-debug debugPath="$PWD/packages/cli"

      - name: Bootstrap application
        working-directory: ../
        run: tramvai-debug new smoke-bootstrap --type=app --template=multirepo --packageManager=npm --testingFramework=jest

      - name: Update tramvai version
        working-directory: ../smoke-bootstrap
        run: tramvai-debug update prerelease

      # by default the generated application installs published `prerelease` packages,
      # so on pull request and manual runs the locally built ones are installed instead,
      # otherwise changes from the branch are not checked at all
      - name: Use local packages in application
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -e
          # workspace packages have the `0.0.0-stub` version, replace it with the real one
          yarn build:change-versions
          mkdir -p ../packs
          for pkg in api plugin-base-builder plugin-webpack-builder; do
            # the `./` prefix is required, otherwise npm treats the path as a GitHub shorthand
            npm pack "./packages/$pkg" --pack-destination ../packs
          done
          cd ../smoke-bootstrap
          npm install --no-save --no-audit --no-fund ../packs/*.tgz

      - name: Install Playwright
        working-directory: ../smoke-bootstrap
        run: yarn playwright install

      - name: Build application
        working-directory: ../smoke-bootstrap
        run: yarn build

      - name: Test:unit application
        working-directory: ../smoke-bootstrap
        run: yarn test

      - name: Test:integration application
        working-directory: ../smoke-bootstrap
        run: yarn test:integration
