<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 650" width="1020" height="650" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
  </defs>

  <text x="510" y="26" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Пять видов данных → коллекторы</text>

  <!-- arrows (drawn first, under the boxes) -->
  <line x1="300" y1="85" x2="680" y2="72" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="490" y="68" font-size="10" text-anchor="middle" fill="#555555">сервер, stdout</text>

  <line x1="300" y1="85" x2="680" y2="167" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="490" y="142" font-size="10" text-anchor="middle" fill="#555555">браузер, FRONT_LOG_API</text>

  <line x1="300" y1="195" x2="680" y2="262" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <line x1="300" y1="305" x2="350" y2="350" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="540" y1="350" x2="680" y2="357" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <line x1="300" y1="415" x2="680" y2="452" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <line x1="300" y1="525" x2="680" y2="547" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- left column: data types -->
  <g>
    <rect x="40" y="50" width="260" height="70" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <text x="170" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Логи</text>
    <text x="170" y="98" font-size="9.5" text-anchor="middle" fill="#555555">@tramvai/module-log</text>
  </g>
  <g>
    <rect x="40" y="160" width="260" height="70" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <text x="170" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Ошибки</text>
    <text x="170" y="208" font-size="9.5" text-anchor="middle" fill="#555555">@tramvai/module-sentry</text>
  </g>
  <g>
    <rect x="40" y="270" width="260" height="70" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <text x="170" y="298" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Метрики</text>
    <text x="170" y="318" font-size="9.5" text-anchor="middle" fill="#555555">@tramvai/module-metrics</text>
  </g>
  <g>
    <rect x="40" y="380" width="260" height="70" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <text x="170" y="408" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Трейсы</text>
    <text x="170" y="428" font-size="9.5" text-anchor="middle" fill="#555555">@tramvai/module-opentelemetry</text>
  </g>
  <g>
    <rect x="40" y="490" width="260" height="70" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <text x="170" y="518" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Аналитика</text>
    <text x="170" y="538" font-size="8.5" text-anchor="middle" fill="#555555">@tramvai-tinkoff/module-statist-api-client</text>
  </g>

  <!-- middle: intermediate mechanism, not a collector -->
  <g>
    <rect x="350" y="320" width="190" height="60" rx="10" ry="10" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="445" y="345" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Prometheus</text>
    <text x="445" y="362" font-size="9" text-anchor="middle" fill="#666666">k8s scrape /metrics</text>
  </g>

  <!-- right column: collectors -->
  <g>
    <rect x="680" y="40" width="280" height="64" rx="10" ry="10" fill="#dbf3ef" stroke="#0f9d8f" stroke-width="1.5"/>
    <text x="820" y="64" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f6b60">Sage</text>
    <text x="820" y="82" font-size="9.5" text-anchor="middle" fill="#333333">логи (stdout)</text>
  </g>
  <g>
    <rect x="680" y="135" width="280" height="64" rx="10" ry="10" fill="#f3e8fb" stroke="#7e57c2" stroke-width="1.5"/>
    <text x="820" y="159" font-size="13" font-weight="bold" text-anchor="middle" fill="#5e35a1">Loggly</text>
    <text x="820" y="177" font-size="9.5" text-anchor="middle" fill="#333333">TinkoffLogModule</text>
  </g>
  <g>
    <rect x="680" y="230" width="280" height="64" rx="10" ry="10" fill="#fde8e8" stroke="#c62828" stroke-width="1.5"/>
    <text x="820" y="254" font-size="13" font-weight="bold" text-anchor="middle" fill="#a31515">Error Hub</text>
    <text x="820" y="272" font-size="9.5" text-anchor="middle" fill="#333333">SENTRY_DSN</text>
  </g>
  <g>
    <rect x="680" y="325" width="280" height="64" rx="10" ry="10" fill="#dbf3ef" stroke="#0f9d8f" stroke-width="1.5"/>
    <text x="820" y="349" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f6b60">Sage Grafana</text>
    <text x="820" y="367" font-size="9.5" text-anchor="middle" fill="#333333">дашборд метрик</text>
  </g>
  <g>
    <rect x="680" y="420" width="280" height="64" rx="10" ry="10" fill="#dbf3ef" stroke="#0f9d8f" stroke-width="1.5"/>
    <text x="820" y="444" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f6b60">Sage collector</text>
    <text x="820" y="462" font-size="9.5" text-anchor="middle" fill="#333333">OTel, трейсы</text>
  </g>
  <g>
    <rect x="680" y="515" width="280" height="64" rx="10" ry="10" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <text x="820" y="539" font-size="13" font-weight="bold" text-anchor="middle" fill="#8a6600">Statist</text>
    <text x="820" y="557" font-size="9.5" text-anchor="middle" fill="#333333">STATIST_API_CLIENT</text>
  </g>

  <!-- legend -->
  <rect x="60" y="605" width="14" height="14" rx="3" fill="#dbf3ef" stroke="#0f9d8f"/>
  <text x="82" y="616" font-size="11" fill="#333333">Sage (логи / Grafana / OTel collector)</text>

  <rect x="380" y="605" width="14" height="14" rx="3" fill="#f3e8fb" stroke="#7e57c2"/>
  <text x="402" y="616" font-size="11" fill="#333333">Loggly</text>

  <rect x="470" y="605" width="14" height="14" rx="3" fill="#fde8e8" stroke="#c62828"/>
  <text x="492" y="616" font-size="11" fill="#333333">Error Hub</text>

  <rect x="580" y="605" width="14" height="14" rx="3" fill="#fff8e1" stroke="#b8860b"/>
  <text x="602" y="616" font-size="11" fill="#333333">Statist</text>
</svg>
