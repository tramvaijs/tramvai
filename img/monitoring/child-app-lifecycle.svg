<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 190" width="1130" height="190" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="565" y="25" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Жизненный цикл Child App</text>

  <!-- boxes -->
  <g>
    <rect x="40" y="50" width="190" height="90" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <rect x="44" y="54" width="6" height="82" rx="3" fill="#4a76c9"/>
    <text x="135" y="74" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Резолв конфига</text>
    <text x="135" y="104" font-size="9" text-anchor="middle" fill="#555555">fetchConfig</text>
  </g>
  <g>
    <rect x="255" y="50" width="190" height="90" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <rect x="259" y="54" width="6" height="82" rx="3" fill="#4a76c9"/>
    <text x="350" y="74" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Preload / Prefetch</text>
    <text x="350" y="98" font-size="9" text-anchor="middle" fill="#555555">preloadChildApp</text>
    <text x="350" y="114" font-size="9" text-anchor="middle" fill="#555555">prefetchChildApp</text>
  </g>
  <g>
    <rect x="470" y="50" width="190" height="90" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <rect x="474" y="54" width="6" height="82" rx="3" fill="#4a76c9"/>
    <text x="565" y="74" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Загрузка ассетов</text>
    <text x="565" y="98" font-size="9.5" text-anchor="middle" fill="#2e7d32">✓ успех</text>
    <text x="565" y="118" font-size="9.5" text-anchor="middle" fill="#c62828">✗ ошибка (после retry)</text>
  </g>
  <g>
    <rect x="685" y="50" width="190" height="90" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <rect x="689" y="54" width="6" height="82" rx="3" fill="#4a76c9"/>
    <text x="780" y="74" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Command line</text>
    <text x="780" y="98" font-size="8.5" text-anchor="middle" fill="#555555">runChildAppCommandLine</text>
    <text x="780" y="113" font-size="8.5" text-anchor="middle" fill="#555555">customer / clear</text>
  </g>
  <g>
    <rect x="900" y="50" width="190" height="90" rx="10" ry="10" fill="#dae8fc" stroke="#333333" stroke-width="1.5"/>
    <rect x="904" y="54" width="6" height="82" rx="3" fill="#4a76c9"/>
    <text x="995" y="74" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Mount</text>
    <text x="995" y="98" font-size="9.5" text-anchor="middle" fill="#2e7d32">✓ mounted</text>
    <text x="995" y="118" font-size="9.5" text-anchor="middle" fill="#c62828">✗ mountFailed</text>
  </g>

  <!-- arrows -->
  <line x1="230" y1="95" x2="255" y2="95" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="445" y1="95" x2="470" y2="95" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="660" y1="95" x2="685" y2="95" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="875" y1="95" x2="900" y2="95" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- legend -->
  <rect x="40" y="158" width="14" height="14" rx="3" fill="#dae8fc" stroke="#4a76c9"/>
  <text x="62" y="169" font-size="11" fill="#333333">lifecycle-плагины (@tramvai/tokens-child-app)</text>
  <text x="470" y="169" font-size="11" fill="#333333">✓ / ✗ - есть пара событий успех/ошибка, иначе - разовое событие</text>
</svg>
